name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Forgejo Container Registry
        run: |
          echo "${{ secrets.FORGEJO_TOKEN || gitea.token }}" | docker login git-registry.p0ntus.com -u "${{ gitea.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          IMAGE_NAME="git-registry.p0ntus.com/${{ gitea.repository_owner }}/aidanso"
          docker build -t "${IMAGE_NAME}:latest" -t "${IMAGE_NAME}:${{ gitea.sha }}" .

      - name: Push Docker image
        run: |
          IMAGE_NAME="git-registry.p0ntus.com/${{ gitea.repository_owner }}/aidanso"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ gitea.sha }}"
